<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <script src="../config/gtm.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LensRewards - Nueva contraseña</title>
  <meta name="description" content="Establece una nueva contraseña para tu cuenta de LensRewards." />
  <style>
    :root{
      --blue:#2f62ff; --ink:#081329; --muted:#64708a; --line:#e7ebf3;
      --shadow-soft:0 14px 35px rgba(15,25,50,.10);
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:#f6f9ff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    a{text-decoration:none;color:inherit}
    .card{width:min(640px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow-soft)}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
    .top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .brand{font-weight:950;font-size:22px;letter-spacing:-.03em}
    .brand span{color:var(--blue)}
    .lang-switch{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 10px;background:#fff;border:1px solid var(--line);border-radius:999px}
    .lang-switch label{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.05em;text-transform:uppercase}
    .lang-switch select{appearance:none;height:28px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:0 28px 0 10px;font-weight:800;font-size:13px;cursor:pointer}
    h1{margin:0 0 8px;font-size:30px;letter-spacing:-.03em}
    .sub{margin:0 0 18px;color:var(--muted);line-height:1.55}
    .field{display:grid;gap:6px;margin-bottom:12px}
    .field label{font-size:13px;font-weight:800;color:#253657}
    .field input{height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;color:#1c2c4b;background:#fff;width:100%}
    .password-meter{margin-top:6px}
    .password-meter-track{height:6px;border-radius:999px;background:#e8eefb;overflow:hidden}
    .password-meter-bar{height:100%;width:0%;border-radius:999px;background:transparent;transition:width .22s ease,background-color .22s ease}
    .password-meter-text{margin-top:6px;font-size:12px;font-weight:700;color:#5f6d88}
    .status{min-height:22px;font-size:14px;font-weight:700;margin-bottom:12px}
    .status.error{color:#dc2626}
    .status.ok{color:#059669}
    .status.loading{color:#2f62ff}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;padding:15px 18px;font-weight:900;border:1px solid transparent;box-shadow:var(--shadow-soft);cursor:pointer;font:inherit}
    .btn-primary{background:linear-gradient(135deg,#2861ff,#5d7cff);color:#fff;width:100%}
    .btn:disabled{opacity:.65;cursor:not-allowed}
    .token-error{margin:0;padding:16px 18px;border-radius:14px;border:1px solid #fecaca;background:#fef2f2;color:#991b1b;font-weight:700;line-height:1.5}
    .links{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
    .links a{font-weight:800;font-size:14px;color:#2f62ff}
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MND64R6K"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <main class="card">
    <div class="top">
      <a class="brand" href="../index.html">Lens<span>Rewards</span></a>
      <div class="top-actions">
        <div class="lang-switch">
          <label for="page-lang" data-i18n="langLabel">Idioma</label>
          <select id="page-lang" aria-label="Language">
            <option value="es">Español</option>
            <option value="en">English</option>
            <option value="pt">Português</option>
          </select>
        </div>
      </div>
    </div>
    <h1 data-i18n="h1">Nueva contraseña</h1>
    <p class="sub" data-i18n="sub">Elige una contraseña segura. Después podrás iniciar sesión en la extensión con tu correo y la nueva contraseña.</p>

    <p id="tokenError" class="token-error" style="display:none" role="alert"></p>

    <form id="resetForm" novalidate style="display:none">
      <div class="field">
        <label for="password" data-i18n="passwordLabel">Nueva contraseña</label>
        <input id="password" type="password" autocomplete="new-password" data-i18n-placeholder="passwordPlaceholder" placeholder="Mínimo 8 caracteres" />
        <div class="password-meter" aria-live="polite">
          <div class="password-meter-track"><div id="passwordStrengthBar" class="password-meter-bar"></div></div>
          <div id="passwordStrengthText" class="password-meter-text" data-i18n="strengthEmpty">Seguridad: —</div>
        </div>
      </div>
      <div class="field">
        <label for="passwordConfirm" data-i18n="confirmLabel">Repetir contraseña</label>
        <input id="passwordConfirm" type="password" autocomplete="new-password" data-i18n-placeholder="confirmPlaceholder" placeholder="Repite la contraseña" />
      </div>
      <div id="status" class="status"></div>
      <button id="submitBtn" type="submit" class="btn btn-primary" data-i18n="submitBtn">Guardar contraseña</button>
    </form>

    <div id="successPanel" style="display:none">
      <p class="status ok" id="successMessage"></p>
      <div class="links">
        <a data-i18n="linkHome" data-i18n-href="home" href="../index.html">Volver al inicio</a>
      </div>
    </div>
  </main>

  <script src="../config/auth-pages-i18n.js"></script>
  <script>
    (function () {
      var API_BASE = "https://api.lensrewards.com";
      var i18n = LensAuthI18n.init({ page: "reset", basePath: "../" });
      var params = new URLSearchParams(window.location.search);
      var token = (params.get("token") || "").trim();

      var tokenErrorEl = document.getElementById("tokenError");
      var resetForm = document.getElementById("resetForm");
      var successPanel = document.getElementById("successPanel");
      var successMessage = document.getElementById("successMessage");
      var statusEl = document.getElementById("status");
      var submitBtn = document.getElementById("submitBtn");
      var passwordInput = document.getElementById("password");
      var passwordConfirmInput = document.getElementById("passwordConfirm");
      var passwordStrengthBar = document.getElementById("passwordStrengthBar");
      var passwordStrengthText = document.getElementById("passwordStrengthText");

      function setStatus(message, type) {
        statusEl.textContent = message || "";
        statusEl.className = "status " + (type || "");
      }

      function showTokenError(message) {
        tokenErrorEl.textContent = message;
        tokenErrorEl.style.display = "block";
        resetForm.style.display = "none";
      }

      function evaluatePasswordStrength(password) {
        var p = String(password || "");
        var score = 0;
        if (p.length >= 8) score += 1;
        if (/[a-z]/.test(p)) score += 1;
        if (/[A-Z]/.test(p)) score += 1;
        if (/\d/.test(p)) score += 1;
        if (/[^A-Za-z0-9]/.test(p)) score += 1;
        if (p.length >= 12) score += 1;
        if (p.length === 0) return { level: "empty", score: score };
        if (score <= 2) return { level: "weak", score: score };
        if (score <= 4) return { level: "medium", score: score };
        return { level: "strong", score: score };
      }

      function updatePasswordMeter() {
        var level = evaluatePasswordStrength(passwordInput && passwordInput.value).level;
        if (!passwordStrengthBar || !passwordStrengthText) return;
        var pct = "0%";
        var bg = "transparent";
        var label = i18n.t("strengthEmpty");
        if (level === "weak") {
          pct = "33%";
          bg = "#f97316";
          label = i18n.t("strengthWeak");
        } else if (level === "medium") {
          pct = "66%";
          bg = "#f59e0b";
          label = i18n.t("strengthMedium");
        } else if (level === "strong") {
          pct = "100%";
          bg = "#10b981";
          label = i18n.t("strengthStrong");
        }
        passwordStrengthBar.style.width = pct;
        passwordStrengthBar.style.backgroundColor = bg;
        passwordStrengthText.textContent = label;
      }

      document.getElementById("page-lang").addEventListener("change", function () {
        if (passwordInput && passwordInput.value) updatePasswordMeter();
      });

      if (!token) {
        showTokenError(i18n.t("errTokenMissing"));
        return;
      }

      resetForm.style.display = "block";
      updatePasswordMeter();
      if (passwordInput) passwordInput.addEventListener("input", updatePasswordMeter);

      resetForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        var password = passwordInput.value;
        var passwordConfirm = passwordConfirmInput.value;

        if (!password || password.length < 8) {
          setStatus(i18n.t("errPasswordMin"), "error");
          return;
        }
        if (password !== passwordConfirm) {
          setStatus(i18n.t("errPasswordMismatch"), "error");
          return;
        }
        var strength = evaluatePasswordStrength(password);
        if (strength.level === "weak" || strength.level === "empty") {
          setStatus(i18n.t("errPasswordWeak"), "error");
          return;
        }

        submitBtn.disabled = true;
        setStatus(i18n.t("saving"), "loading");

        try {
          var res = await fetch(API_BASE + "/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, password: password })
          });
          var data = await res.json().catch(function () { return {}; });

          if (!res.ok || data.status === "KO") {
            var msg = data.mensaje || data.message || i18n.t("errGeneric");
            if (data.code === "TOKEN_EXPIRED") msg = i18n.t("errTokenExpired");
            else if (data.code === "TOKEN_USED") msg = i18n.t("errTokenUsed");
            else if (data.code === "INVALID_TOKEN") msg = i18n.t("errTokenInvalid");
            setStatus(msg, "error");
            return;
          }

          resetForm.style.display = "none";
          successMessage.textContent = i18n.lang() === "es" && data.mensaje ? data.mensaje : i18n.t("successDefault");
          successPanel.style.display = "block";
        } catch (err) {
          setStatus(i18n.t("errConnection"), "error");
        } finally {
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
  <script defer src="../config/apply-site-links.js"></script>
</body>
</html>
